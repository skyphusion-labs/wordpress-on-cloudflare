name: opcache-build

# The b-dosql OPcache build (build.sh, then opcache.sh) on a GitHub-hosted runner, as
# deploy-workers.yml runs it for zarapo and woocap (#371). That build boots the Worker with the
# pinned Wrangler (deploy/wr) in local mode and primes the OPcache. Before #371 it called a bare
# `wrangler`, which a runner does not have, so the deploy failed before any upload and only a deploy
# found out. This runs on the pull request that could break it. No secrets: the build deploys
# nothing and uses no remote binding (opcache.sh runs wrangler dev --local).
on:
  pull_request:
    paths:
      - 'spikes/b2-wordpress/**'
      - 'deploy/deploy.sh'
      - 'deploy/wr'
      - 'deploy/tools/**'
      - '.github/workflows/opcache-build.yml'

permissions:
  contents: read

jobs:
  opcache-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: No wrangler on PATH (the build must use deploy/wr)
        run: |
          if command -v wrangler; then echo "::error::a global wrangler is on the runner PATH; this job could not see a bare call"; exit 1; fi
          echo "no global wrangler: ok"
      - name: Build (b-dosql, WooCommerce primed)
        working-directory: spikes/b2-wordpress
        run: |
          set -euo pipefail
          npm ci --silent
          ./prepare.sh | tail -1
          ./build.sh | tail -1
          s=$(date +%s)
          if DEV_ENV=dosql-local WOO_ACTIVE=1 ./opcache.sh > build/opcache.log 2>&1; then
            tail -1 build/opcache.log
            echo "opcache.sh took $(( $(date +%s) - s )) s"
          else
            echo "::error::opcache.sh failed; last lines of build/opcache.log and dev.log:"
            tail -40 build/opcache.log; echo '--- dev.log'; tail -40 dev.log 2>/dev/null || true
            exit 1
          fi
      - name: ALL OPcache files as remote packs, end to end on workerd (issue #563, OPCACHE_REMOTE, no split)
        # On the primed build above: the trace, opcache-remote.py, then tests/remote-e2e.sh runs the
        # pages, the admin and the store three ways (remote packs, cap 0, off). Each must work.
        working-directory: spikes/b2-wordpress
        run: |
          set -euo pipefail
          s=$(date +%s)
          if ! WOO_ACTIVE=1 DEV_ENV=dosql-local ./file-trace.sh > build/file-trace.log 2>&1; then
            echo "::error::file-trace.sh failed"; tail -30 build/file-trace.log; exit 1
          fi
          python3 -I opcache-remote.py build/opcache.zip build/file-trace.json build/build-id.js
          # #569 (#394 Gate 2): the site.zip read pattern and the simulated fetches per request, from
          # the same trace (a measurement; site.zip is untouched by opcache-remote.py).
          python3 -I site-trace-report.py build/site.zip build/file-trace.json build/opcache-remote-index.js
          grep -E 'cold|warm' build/file-trace-admin.log || true
          if ! tests/remote-e2e.sh; then
            echo "::error::remote-e2e.sh failed; last lines of dev.log:"; tail -40 dev.log 2>/dev/null || true; exit 1
          fi
          # #569 (SITE_REMOTE): site.zip to packs as well (it empties site.zip, so it runs last), then the
          # same three cases with the site served only from packs.
          python3 -I site-remote.py build/site.zip build/file-trace.json build/build-id.js
          # MEASUREMENT (#569): the site held budget at 8192 KiB, to read the OPcache-off cases' fetches.
          if ! REMOTE_E2E_SITE=1 REMOTE_E2E_SITE_HOLD=8192 tests/remote-e2e.sh; then
            echo "::error::remote-e2e.sh (site) failed; last lines of dev.log:"; tail -40 dev.log 2>/dev/null || true; exit 1
          fi
          echo "remote steps took $(( $(date +%s) - s )) s"
