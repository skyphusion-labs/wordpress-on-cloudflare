name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Same pin as spikes/b2-wordpress/build.sh.
  SQLITE_DI_REF: f05c1f9
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # ubuntu-latest ships PHP 8.3. Third-party actions are not on the org allowlist.
      - run: php -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Terraform 1.17.1 (checksum-verified)
        # Not hashicorp/setup-terraform: the org allowlist refuses it (run 43196743912), and the
        # lead ruled against widening the allowlist for one job (#336). Same pattern as ggc ci.yml.
        # The sha256 is HashiCorp's own SHA256SUMS line for this zip; a mismatch stops the job here.
        # Early on purpose: custom-domain-test.sh and tf-clean-test.sh skip their terraform half
        # when terraform is not on PATH, so an install after them leaves those halves unrun.
        run: |
          set -euo pipefail
          ver=1.17.1
          zip="terraform_${ver}_linux_amd64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${ver}/${zip}"
          if ! echo "4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061  $RUNNER_TEMP/$zip" | sha256sum -c -; then
            echo "::error::terraform ${ver} zip sha256 mismatch; refusing to install it"
            exit 1
          fi
          sudo unzip -o -q "$RUNNER_TEMP/$zip" -d /usr/local/bin
          terraform version
      - name: Fetch the SQLite driver
        run: |
          git clone -q https://github.com/WordPress/sqlite-database-integration spikes/b2-wordpress/build/cache/sqlite-database-integration
          git -C spikes/b2-wordpress/build/cache/sqlite-database-integration checkout -q "$SQLITE_DI_REF"
      - name: PHP syntax
        run: for f in spikes/b2-wordpress/php/*.php spikes/b2-wordpress/tests/*.php deploy/import/*.php; do php -l "$f"; done
      - name: JS syntax
        # The Workers are ES modules but package.json says commonjs, so check them as .mjs.
        run: |
          for f in spikes/b1-boot/index.js spikes/b2-wordpress/index.js spikes/b2-wordpress/sql-import.js spikes/c1-woo-container/worker.js spikes/c1-woo-container/warm.js; do cp "$f" "$RUNNER_TEMP/check.mjs" && node --check "$RUNNER_TEMP/check.mjs"; done
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Release bundle manifest (issue #405)
        # deploy/release: the manifest the one-click admin checks a downloaded bundle against. Offline.
        run: node deploy/release/tests/bundle-manifest-test.mjs
      - name: Live-site code redeploys refuse a mismatch (fleet-chezmoi#2620)
        run: |
          bash deploy/tests/code-only-test.sh
          python3 -I deploy/live-sites/tests/check-live-test.py
      - name: Wrangler is pinned and called through deploy/wr
        # deploy/tools holds the exact version; a bare npx call runs whatever is installed or the latest.
        run: bash deploy/tests/wrangler-pin-test.sh
      - name: Deploy scripts keep the spike token and admin password out of curl's command line
        # -K <(printf 'header = ...') instead of -H: the value is not in the process list.
        run: bash deploy/tests/curl-argv-test.sh
      - name: Dialect tests
        run: php spikes/b2-wordpress/tests/dialect-test.php
      - name: Approach A literal tests (issue #79)
        run: php tests/a/literals-test.php
      - name: Approach A object cache isolated mode (issue #218)
        # spikes/b2-wordpress/php/object-cache-js.php: the allowlist + TTL + force-off
        # posture, with a stubbed bridge (no DB). WooCommerce groups never persist.
        run: php spikes/b2-wordpress/tests/object-cache-isolated-test.php
      - name: approach A keeps FOUND_ROWS and LAST_INSERT_ID on one pooled connection (issue #498)
        run: php tests/a/found-rows-test.php
      - name: approach A object-cache KV writes are coalesced and 429s counted (issue #500)
        run: node --test spikes/b2-wordpress/tests/oc-l2-writer.test.mjs
      - name: b-dosql approach-A options never persist across isolates (issue #491)
        run: php spikes/b2-wordpress/tests/object-cache-491-test.php
      - name: Approach A object cache source invariants (issue #218)
        # spikes/b2-wordpress/index.js: the approach-A gate, the x-oc-off bracket, and
        # the per-table / per-group instrumentation, as shipped-source invariants.
        run: node spikes/b2-wordpress/tests/oc-isolated-test.mjs
      - name: Import tests
        # deploy/import (issue #31): dump to SQLite, prefix, site address, dbmove dump. Offline.
        run: deploy/import/tests/run.sh
      - name: Import media refusal tests
        # deploy/import/media.sh (issue #124): a refused or failed HEAD is retried, then fails; it never counts as missing.
        run: deploy/import/tests/media-refuse-test.sh
      - name: plugin-memory.py never counts a page-cache copy as a fresh runtime (issue #344)
        # A fake site on localhost replays cached x-boot 1, as the page cache does. The case that
        # reproduces the old probe needs git history and skips in a shallow checkout.
        run: python3 -I tests/wfp/plugin-memory-test.py
      - name: Gate 2 plugin harness, offline (#426)
        # tests/plugins/gate2.py against a fake WordPress: the four read-back classes, write-loss, headers-only recording.
        run: |
          python3 -I tests/plugins/gate2_test.py
          # the CMS phase (#422): editor, media, menus, widgets, site editor or customizer, settings, users, comments
          python3 -I tests/plugins/cms_test.py
          bash tests/fixtures/tests/theme-unit-test.sh
          # fetch.sh (#457): THEMES, the unpinned-slug refusal, the SHA, link and parent-theme refusals.
          bash tests/plugins/fetch-test.sh
      - name: b-dosql mail From address
        run: node --test spikes/b2-wordpress/tests/mail-from.test.mjs
      - name: b-dosql demo site lock
        run: node --test spikes/b2-wordpress/tests/site-lock.test.mjs
      - name: Admin memory trace is operator-only, and its harness summary (#434)
        run: |
          node --test spikes/b2-wordpress/tests/mem-trace.test.mjs
          python3 -I tests/wfp/admin-mem-test.py
      - name: Memory trace hooks mode against WordPress's own hook code (#504)
        # The three wp-includes files of the pinned WordPress (spikes/b2-wordpress/build.sh
        # WP_VERSION=7.1.4), each checked against its sha256 (equal to the copies in the
        # sha1-verified release zip) before the test reads them.
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/wp-includes"
          mkdir -p "$d"
          for f in plugin.php:d70b9e18d34ab3fe46e15548a5e8e089ea5920832f06a4d89a9d64b2f7938b0d \
                   class-wp-hook.php:b839c0e5672246bca8db1ab781ec8835f7732f253c375a237cbf6ec536e8d12e \
                   class-wp-filter-sentinel.php:68c9c675d3805a343835728d98a0efedf0df9833cb904bebf909c7e0fda5c61c; do
            name="${f%%:*}"; sum="${f##*:}"
            curl -fsSL -o "$d/$name" "https://raw.githubusercontent.com/WordPress/WordPress/7.1.4/wp-includes/$name"
            echo "$sum  $d/$name" | sha256sum -c - || { echo "::error::$name sha256 mismatch"; exit 1; }
          done
          php spikes/b2-wordpress/tests/mem-trace-hooks-test.php "$d"
      - name: b-dosql rows-only export for a store move, against a real SQLite (#479)
        run: node --test spikes/b2-wordpress/tests/mysql-export.test.mjs
      - name: b-dosql performance headers need the spike token
        run: node --test spikes/b2-wordpress/tests/perf-headers.test.mjs
      - name: b-dosql a memory reset is not an overload (issue #335)
        # object-error.mjs: an isolate memory reset answers x-isolate-reset, never x-overloaded.
        run: node --test spikes/b2-wordpress/tests/object-error.test.mjs
      - name: b-dosql a write lost to an isolate reset never answers success (issue #350)
        # write-loss.mjs: a 500 "may have been saved", no Retry-After, no Set-Cookie, on both reset paths; GET and HEAD keep the #349 retry.
        run: node --test spikes/b2-wordpress/tests/write-loss.test.mjs
      - name: b-dosql a request with lost writes holds its mail (issue #368)
        run: node --test spikes/b2-wordpress/tests/request-mail-hold.test.mjs
      - name: b-dosql bundle file trace, route classes (issue #394 M0)
        run: node --test spikes/b2-wordpress/tests/file-trace.test.mjs
      - name: b-dosql OPcache split into warm and boot (issue #394 L1)
        run: python3 -I spikes/b2-wordpress/tests/opcache-split-test.py
      - name: b-dosql every OPcache file to packs in cold-boot read order, opcache.zip empty, no boot pack (issue #563)
        run: python3 -I spikes/b2-wordpress/tests/opcache-remote-pack-test.py
      - name: measure394 read-back states, a failed read is never an absent row (issue #519)
        run: python3 -I spikes/b2-wordpress/tests/measure394-state-test.py
      - name: b-dosql runtime guards, raw sockets and PHP messages (issue #452)
        run: node --test spikes/b2-wordpress/tests/runtime-guards.test.mjs
      - name: b-dosql a recycled PHP runtime is released (issue #394)
        run: node --test spikes/b2-wordpress/tests/release-runtime.test.mjs
      - name: b-dosql the scheduled snapshot route (issue #533)
        # db-snapshot.mjs: SNAPSHOT_TOKEN only, gzip into the site's own bucket, read back; held, cut, too big and failed dumps store nothing.
        run: node --test spikes/b2-wordpress/tests/db-snapshot.test.mjs
      - name: b-dosql every Pages.purge RPC result is disposed (issue #510)
        run: node --test spikes/b2-wordpress/tests/rpc-dispose.test.mjs
      - name: load test admin loops and cleanup, against a stub site (issue #394)
        run: python3 tests/load/admin-stub-test.py
      - name: load test 1102 counter counts 5xx only (issue #394)
        run: python3 tests/load/is1102-test.py
      - name: b-dosql the isolate memory ledger (issue #394)
        run: node --test spikes/b2-wordpress/tests/mem-ledger.test.mjs
      # The arena test inflates real deflate data with fflate, the Worker's own inflater (#508). The
      # ci job installs nothing else, so install the Worker's locked dependencies here (no scripts).
      - name: b-dosql Worker dependencies, as locked (for the arena test)
        working-directory: spikes/b2-wordpress
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: b-dosql the reused inflate arena keeps every file's bytes (issue #394 step 2)
        run: node --test spikes/b2-wordpress/tests/inflate-arena.test.mjs
      - name: b-dosql a PHP write to a lazy bundle file survives the evict, real MEMFS code (issue #530)
        run: node --test spikes/b2-wordpress/tests/lazy-write.test.mjs
      - name: b-dosql the headroom probe streams its reach, off by default (issue #394)
        run: node --test spikes/b2-wordpress/tests/headroom.test.mjs
      - name: b-dosql a dropped runtime is released once nothing uses it (issue #566)
        run: node --expose-gc --test spikes/b2-wordpress/tests/drop-runtime.test.mjs
      - name: b-dosql the lazy inflate cache defaults to 2 MiB (issue #394)
        run: node --test spikes/b2-wordpress/tests/lazy-cache-default.test.mjs
      - name: b-dosql x-perf isoAgeS is the isolate age (issue #474)
        run: node --test spikes/b2-wordpress/tests/iso-age.test.mjs
      - name: b-dosql outbound host allowlist
        run: node --test spikes/b2-wordpress/tests/http-allow.test.mjs
      - name: email-queue unit tests
        run: node --test spikes/b2-wordpress/tests/email-queue.test.mjs
      - name: promise-bound unit tests
        run: node --test spikes/b2-wordpress/tests/promise-bound.test.mjs
      - name: zone cache purge helpers (issue #205)
        run: node --test spikes/b2-wordpress/tests/purge-zone.test.mjs
      - name: zone cache purge mu-plugin (issue #205)
        run: php spikes/b2-wordpress/tests/zone-cache-purge-test.php
      - name: pdf invoice helpers (issue #227)
        run: node --test spikes/b2-wordpress/tests/pdf-invoice.test.mjs
      - name: pdf invoice mu-plugin (issue #227)
        run: php spikes/b2-wordpress/tests/pdf-invoice-test.php
      - name: turnstile helpers (issue #250)
        run: node --test spikes/b2-wordpress/tests/turnstile.test.mjs
      - name: turnstile forms mu-plugin (issue #250)
        run: php spikes/b2-wordpress/tests/turnstile-forms-test.php
      - name: b-dosql safe outbound URLs without DNS (issue #430)
        run: php spikes/b2-wordpress/tests/http-safe-url-test.php
      - name: turnstile block checkout script (issue #308)
        # A classic browser script, not a module: syntax, then the stubbed store and widget.
        run: |
          node --check spikes/b2-wordpress/php/turnstile-block-checkout.js
          node --test spikes/b2-wordpress/tests/turnstile-block-checkout.test.mjs
      - name: turnstile classic checkout script (issue #400)
        # A classic browser script, not a module: syntax, then the stubbed page, jQuery and widget.
        run: |
          node --check spikes/b2-wordpress/php/turnstile-classic-checkout.js
          node --test spikes/b2-wordpress/tests/turnstile-classic-checkout.test.mjs
      - name: pageview analytics helpers (issue #201)
        run: node --test spikes/b2-wordpress/tests/analytics.test.mjs
      - name: cf bridge ops (issue #330)
        # spikes/b2-wordpress/cf-bridge.mjs: aiEmbed and vectorize on env.AI and
        # env.SEARCH_INDEX. No index create, list or delete. topK and the batch
        # sizes are named constants.
        run: node --test spikes/b2-wordpress/tests/cf-bridge.test.mjs
      - name: b-dosql a stale alarm is re-armed (issue #291)
        run: node --test spikes/b2-wordpress/tests/alarm-arm.test.mjs
      - name: b-dosql import holds the cron off
        # import-hold.mjs: no cron run between two /_dbimport parts (fdprobe1112a, 2026-11-12).
        run: node --test spikes/b2-wordpress/tests/import-hold.test.mjs
      - name: b-dosql the store-move cron hold (#479)
        run: node --test spikes/b2-wordpress/tests/move-hold.test.mjs
      - name: b-dosql /_activate reports a plugin that ends the request (issue #289)
        # activate-report.test.mjs runs the real activation script with the php CLI against stubs.
        run: node --test spikes/b2-wordpress/tests/activate-report.test.mjs
      - name: b-dosql the cron tick never runs the Action Scheduler queue runner (issue #335)
        # cron-run-queue.test.mjs runs the real runCron script with the php CLI against stubs.
        run: node --test spikes/b2-wordpress/tests/cron-run-queue.test.mjs
      - name: b-dosql Action Scheduler runs only in the alarm, never from a page (issue #358)
        # as-alarm-only.test.mjs runs the real mu-plugin with the php CLI against a hook stub.
        run: node --test spikes/b2-wordpress/tests/as-alarm-only.test.mjs
      - name: b-dosql the cron tick claims a new order email before the backlog (issue #357)
        # cron-email-first.test.mjs runs the real runCron script with the php CLI against a stub store with the claim rules.
        run: node --test spikes/b2-wordpress/tests/cron-email-first.test.mjs
      - name: b-dosql a cron tick hands each email off from inside the op (issue #362)
        # email-handoff.test.mjs: a reset at every statement of a model tick (soft and hard) loses no
        # completed order email and sends none twice; it also runs the real wp-mail-queue.php and the
        # real runCron WP-Cron leg with the php CLI against stubs.
        run: node --test spikes/b2-wordpress/tests/email-handoff.test.mjs
      - name: b-dosql bounded cron tick
        # cron-bound.mjs: the cron runs its own claim loop, bounded, and the cleaner cannot starve (#291).
        run: node --test spikes/b2-wordpress/tests/cron-bound.test.mjs
      - name: b-dosql a purge alarm runs the cron leg only when due (issue #470)
        run: node --test spikes/b2-wordpress/tests/cron-leg-due.test.mjs
      - name: b-dosql a cron leg that keeps dying backs off and says why (issue #471)
        run: node --test spikes/b2-wordpress/tests/cron-health.test.mjs
      - name: b-dosql build id carries the content inputs (issue #285)
        run: python3 -I spikes/b2-wordpress/tests/content-id-test.py
      - name: b-dosql build id says whether the OPcache is primed (issue #377)
        run: spikes/b2-wordpress/tests/build-id-test.sh
      - name: b-dosql operator endpoints (issue #35)
        # /_build and /_evict are gated and never cached (spikes/b2-wordpress).
        run: node spikes/b2-wordpress/tests/build-evict-test.mjs
      - name: WfP slice 5 update tests (issue #35)
        # snapshot/restore, the build activation wait, and the all-sites ordering.
        run: |
          deploy/wfp/tests/dbsnap-test.sh
          python3 -I deploy/wfp/tests/fresh-test.py
          deploy/wfp/tests/wait-build-test.sh
          deploy/wfp/tests/update-all-test.sh
          deploy/wfp/tests/update-inputs-test.sh
          deploy/wfp/tests/rollback-build-test.sh
          python3 -I deploy/wfp/tests/rollback-artifact-test.py
          python3 -I deploy/wfp/tests/bucket-listing-test.py
          deploy/wfp/tests/rollback-slim-test.sh
          deploy/wfp/tests/build-inputs-test.sh
          deploy/wfp/tests/kv-build-test.sh
          deploy/wfp/tests/config-hash-test.sh
      - name: deploy/zone owner guard (issue #282)
        # apply.sh and destroy.sh refuse to overwrite a cache phase another root owns.
        run: deploy/zone/tests/owner-guard-test.sh
      - name: c1 warm start tests
        # spikes/c1-woo-container/warm.js (issue #73): product views, rate limits, never through fetch.
        run: node spikes/c1-woo-container/tests/warm-test.mjs
      - name: c1 container fetch timeout tests
        # spikes/c1-woo-container/worker.js (issue #93): a hung container gets 504, admin is exempt.
        run: node spikes/c1-woo-container/tests/timeout-test.mjs
      - name: c1 deploy check tests
        # deploy/variants/c1.sh c1_check (issue #99) against a fake site: an old container first, a stuck PHP.
        run: deploy/variants/tests/c1-check-test.sh
      - name: c1 rollout wait tests
        # deploy/variants/c1.sh c1_rollout and c1_wait (issue #106) against a fake containers API.
        run: deploy/variants/tests/c1-rollout-test.sh
      - name: c1 boot log watch tests
        # deploy/variants/c1.sh c1_up_watch and c1-bootwatch.py (issue #103) against a fake site and bucket: no log, a stalled log, an old log.
        run: deploy/variants/tests/c1-bootwatch-test.sh
      - name: fixtures terraform root leaves the clone clean
        # tests/fixtures/terraform: every Terraform artifact is ignored and the lock file is tracked. The init half runs where terraform exists (not on the runner).
        run: tests/fixtures/tests/tf-clean-test.sh
      - name: sample-store loader login against a Turnstile gate (issue #354)
        # tests/fixtures/sample-store-login.sh with a fake curl: the test key gets the dummy token, a real key is reported as not checked.
        run: tests/fixtures/tests/sample-store-login-test.sh
      - name: zone cache ruleset tests
        # deploy/zone: the bypass rule is last and keeps every per-user and operator request out of the edge cache.
        run: node --test deploy/zone/tests/cache-ruleset.test.mjs
      - name: WfP reference tests
        # deploy/wfp (issue #35): the dispatcher, the rendered configs (one dispatcher config), the namespace-script check, the new site map write wait.
        run: |
          node deploy/wfp/tests/dispatcher-test.mjs
          deploy/wfp/tests/render-test.sh
          deploy/wfp/tests/snapshot-wiring-test.sh
          deploy/wfp/tests/phase-b-cron-test.sh
          deploy/wfp/tests/deploy-retry-test.sh
          deploy/wfp/tests/ns-state-test.sh
          deploy/wfp/tests/kv-ready-test.sh
          deploy/wfp/tests/wait-site-test.sh
          deploy/wfp/tests/recorded-host-test.sh
          deploy/wfp/tests/bundle-size-test.sh
          deploy/wfp/tests/search-index-test.sh
          deploy/wfp/tests/turnstile-wiring-test.sh
          deploy/wfp/tests/woo-active-test.sh
          spikes/b2-wordpress/tests/opcache-check-test.sh
          deploy/wfp/tests/snapshot-test.sh
          deploy/wfp/tests/site-cmd-test.sh
          deploy/wfp/tests/down-key-test.sh
          deploy/wfp/tests/r2-temp-test.sh
          deploy/wfp/tests/custom-domain-test.sh
          python3 deploy/wfp/tests/check-test.py
          python3 -I deploy/wfp/tests/obs-settings-test.py
          node deploy/provision/tests/ops-test.mjs
          node deploy/provision/tests/provision-test.mjs
          node deploy/provision/tests/cli-test.mjs
          node deploy/provision/tests/worker-test.mjs
          node deploy/provision/tests/server-config-test.mjs
          node deploy/provision/tests/wp-site-config-test.mjs
          node deploy/provision/tests/descriptor-table-test.mjs
          node deploy/provision/tests/a-site-config-test.mjs
          node deploy/provision/tests/measurement-flags-test.mjs
          node deploy/provision/tests/demo-test.mjs
          node deploy/provision/tests/custom-hostname-test.mjs
          node deploy/provision/tests/hostname-cli-test.mjs
          node deploy/oneclick/tests/admin-test.mjs
          node deploy/oneclick/tests/button-test.mjs
          deploy/oneclick/tests/dryrun-test.sh
          node deploy/oneclick-live/tests/live-test.mjs
          python3 deploy/wfp/tests/bindings-test.py
          python3 -I deploy/wfp/tests/bindings-render-test.py
          python3 deploy/wfp/tests/cross-test.py
          deploy/wfp/tests/probe-entry-test.sh
          deploy/wfp/tests/setup-green-test.sh
      - name: Golden render gate (issue #328)
        # deploy/tests/render-golden: render_user, the CLI and Worker provisioning uploads, and the
        # bindings.py decision, for a fixed set of site configs, byte for byte against goldens/.
        # A render change fails here; one made on purpose regenerates goldens/ with --update.
        run: deploy/tests/render-golden/render-golden-test.sh
      - name: WfP terraform checks (issue #336)
        # deploy/wfp/tests/tf-test.sh: validate and fmt for terraform/shared and site, and the
        # site graph makes no account token (#273). init runs with
        # -backend=false, so no state and no credential: the providers come from the registry.
        run: deploy/wfp/tests/tf-test.sh
      - name: deploy/destroy.sh checks (offline)
        # deploy/tests/destroy-test.sh (deploy/README.md) was in no workflow, so it never ran (#527).
        # It needs the cloudflare provider of deploy/terraform: init with -backend=false (no state,
        # no credential) and -lockfile=readonly (the tracked lock file must not change), then the
        # lock file is checked unchanged so the later steps see a clean tree.
        run: |
          terraform -chdir=deploy/terraform init -backend=false -input=false -lockfile=readonly >/dev/null
          git diff --exit-code deploy/terraform/.terraform.lock.hcl
          deploy/tests/destroy-test.sh
      - name: c1 load analysis tests
        # tests/load/c1_arm.py (issue #99): held requests, CPU per order, the split, on a synthetic job.
        run: python3 tests/load/c1_arm_test.py
      - name: c1 warm start split tests
        # tests/load/warm_start.py split() (issue #92): the start steps and the PHP time of the add to cart, from synthetic container logs.
        run: python3 tests/load/warm_start_test.py
      - name: c1 mail tests
        # php/c1-mail.php, Store.sendMail in worker.js, the mail config and deploy check (issue #104).
        run: |
          php spikes/c1-woo-container/tests/mail-test.php
          node spikes/c1-woo-container/tests/mail-worker-test.mjs
          deploy/variants/tests/c1-mail-config-test.sh
      - name: R2 empty tests
        # deploy/variants/r2-empty.sh (issue #115): a 403 on the list or a delete is retried for a bounded time.
        run: deploy/variants/tests/r2-empty-test.sh
      - name: Onboarding Phase 1 Hyperdrive config tests (issue #240)
        # deploy/onboard: provider choice to a caching-disabled Hyperdrive config,
        # the SQL_MODE contract, Azure reuse, the PlanetScale direct-host guard. Offline.
        run: |
          node deploy/onboard/tests/hyperdrive-test.mjs
          node deploy/onboard/tests/onboard-test.mjs
      - name: No em or en dashes
        run: |
          if git grep -nP '\x{2014}|\x{2013}' -- . ':!**/package-lock.json'; then echo 'em or en dash found'; exit 1; fi
      - name: Secret scan
        run: |
          if git grep -nE 'AKIA[0-9A-Z]{16}|cfut_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY|xox[bap]-[A-Za-z0-9-]{10,}'; then echo 'possible secret'; exit 1; fi
      # Last in the job: it switches to Node 24, which runs the JSPI loader (Node 22 cannot).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: PHP heap views past the 128 MiB ArrayBuffer limit (issue #518)
        # prepare.sh builds the loader with the heap subarray patch; the test boots it with an
        # injected limit, and a copy without the patch must fail as production did.
        working-directory: spikes/b2-wordpress
        run: |
          npm ci --silent --no-audit --no-fund
          ./prepare.sh
          node --test tests/heap-subarray.test.mjs
      - name: The allocator reading of /_memprobe and the memory trace (issue #547)
        # Boots the loader the step above built with USE_ZEND_ALLOC 0 and 1; each reader must tell them apart.
        working-directory: spikes/b2-wordpress
        run: node --test tests/allocator-reading.test.mjs
      - name: OPcache files fetched while PHP pauses in open(), fail clean, a streaming held budget, default off (issue #563)
        # The real loader and PHP: a remote OPcache pack is used only when fetched and checked; a 404,
        # a short pack, a SHA-256 mismatch and the fetch cap each give a clean compile from source; a
        # loader copy without the import-pattern edit must NOT use the pack; no hook, no wrapped open().
        working-directory: spikes/b2-wordpress
        run: node --test tests/opcache-remote.test.mjs tests/remote-packs.test.mjs
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pcov
        run: |
          # ubuntu-latest moved to 26.04, which has no php8.3-pcov. Install pcov for the
          # runner's own PHP instead of naming a version, so the next image bump does not
          # break this step again.
          sudo apt-get update -q && sudo apt-get install -y -q php-cli php-pcov
          v=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
          echo "runner PHP $v"
          sudo phpenmod -v "$v" -s cli pcov
          php -m | grep -i pcov
      - name: Fetch the SQLite driver
        run: |
          git clone -q https://github.com/WordPress/sqlite-database-integration spikes/b2-wordpress/build/cache/sqlite-database-integration
          git -C spikes/b2-wordpress/build/cache/sqlite-database-integration checkout -q "$SQLITE_DI_REF"
      - name: Dialect coverage
        run: php -d pcov.enabled=1 spikes/b2-wordpress/tests/coverage.php 0
